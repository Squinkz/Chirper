[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chirper"
version = "0.1.0"
description = "A Python sound synthesizer and DSP toolkit for building short sounds."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
performance = [
    "numba>=0.63",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["Chirper*"]
